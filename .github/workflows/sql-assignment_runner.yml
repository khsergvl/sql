name: SQL Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'main'

permissions:
  contents: read
  pull-requests: write

jobs:
  run-assignment-queries:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r ./.github/scripts/requirements.txt

      - name: Get changed files
        id: changes
        run: |
          git fetch
          git diff --name-only origin/main  > changed_files.txt
      
          echo "Changed files:"
          cat changed_files.txt
      
          if grep -qE '(^|/)assignment2\.sql$' changed_files.txt; then
            echo "assignment_changed=test_assignment_2" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '(^|/)assignment1\.sql$' changed_files.txt; then
            echo "assignment_changed=test_assignment_1" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        id: pytest
        run: |
          pytest tests/test_assignment.py::${{steps.changes.outputs.assignment_changed}} --tb=short --disable-warnings \
                 --junitxml=pytest-report.xml || true

      - name: Post test results to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const file_read_result = fs.readFileSync('test-results.json', 'utf8')
            const results = JSON.parse(file_read_result)
            let body = `### 🧪 SQL Queries Run Results\n\n`
            body += `<details> <summary>Click to expand/collapse assignment queries executions results</summary>` 
            for (const result of results) {
              body += `✅ Query ${result.number}: ${result.query}**, \n\n Results: **${result.result}**; \n\n`
            }
            body += `</details>`
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            })

