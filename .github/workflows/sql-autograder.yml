name: SQL Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'main'

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r ./.github/scripts/requirements.txt

      - name: Run tests
        id: pytest
        run: |
          pytest --tb=short --disable-warnings \
                 --junitxml=pytest-report.xml || true

      - name: Post test results to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const results = fs.readFileSync('test-results.json', 'utf8')
            let body = `### 🧪 SQL Queries Run Results\n\n`
            for (const result of results) {
              body += `✅ Query number: **${result.number}**, Query: **${result.query}**, Reults: **${result.result}**, \n`
            }
            
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            })

